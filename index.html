<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aircraft Component Origins — Global Supply Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07111f;
  --surface: #0b1928;
  --card: #0e2035;
  --border: rgba(80,150,220,0.14);
  --border-hover: rgba(80,150,220,0.35);
  --accent: #2d7dd2;
  --accent-bright: #5ba3f5;
  --text: #a8c8e8;
  --text-dim: #4a6a8a;
  --text-bright: #deeeff;
  --grid: rgba(80,150,220,0.055);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;
}

/* ── HEADER ── */
header{
  text-align:center;
  padding:72px 24px 52px;
  position:relative;
}
header::after{
  content:'';
  position:absolute;
  bottom:0;left:50%;transform:translateX(-50%);
  width:600px;max-width:90%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(80,150,220,0.3),transparent);
}
.tag{
  display:inline-block;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--accent-bright);
  border:1px solid rgba(91,163,245,0.25);
  padding:4px 14px;border-radius:2px;
  margin-bottom:22px;
  background:rgba(91,163,245,0.06);
}
header h1{
  font-size:clamp(2rem,4.5vw,3.2rem);
  font-weight:800;color:var(--text-bright);
  letter-spacing:-0.025em;line-height:1.1;
  margin-bottom:14px;
}
header h1 em{font-style:normal;color:var(--accent-bright);}
header p{
  font-size:.93rem;color:var(--text-dim);
  max-width:480px;margin:0 auto;line-height:1.75;
}

/* ── MAIN ── */
main{max-width:1280px;margin:0 auto;padding:0 32px 100px;}

.mfr-section{margin-bottom:64px;}

.mfr-head{
  display:flex;align-items:center;gap:18px;
  padding:36px 0 20px;
  border-bottom:1px solid var(--border);
  margin-bottom:28px;
}
.mfr-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--text-dim);border:1px solid var(--border);
  padding:3px 10px;border-radius:2px;
}
.mfr-head h2{
  font-size:1.3rem;font-weight:700;
  color:var(--text-bright);letter-spacing:-0.01em;
}

/* ── CARDS ── */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:6px;
  cursor:pointer;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  overflow:hidden;
}
.card:hover{
  transform:translateY(-5px);
  border-color:var(--border-hover);
  box-shadow:0 16px 50px rgba(45,125,210,.13);
}
.card-silhouette{
  height:175px;
  background:rgba(5,12,22,.55);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  padding:16px 20px;
  position:relative;
  overflow:visible;
}
.card-silhouette svg{
  width:100%;height:100%;overflow:visible;
}
.card-body{padding:18px 20px 0;}
.card-model{font-size:.98rem;font-weight:700;color:var(--text-bright);margin-bottom:3px;}
.card-sub{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:14px;}
.card-specs{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:0;}
.spec{display:flex;flex-direction:column;gap:2px;}
.spec-k{font-size:8.5px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim);}
.spec-v{font-size:11.5px;font-weight:600;color:var(--text);}
.card-cta{
  display:flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:600;letter-spacing:.06em;
  color:var(--accent-bright);
  padding:12px 20px;
  border-top:1px solid var(--border);
  margin-top:16px;
  transition:gap .18s;
}
.card:hover .card-cta{gap:10px;}
.card-cta span{margin-left:auto;font-size:13px;}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;
  background:rgba(4,9,18,.93);
  backdrop-filter:blur(10px);
  z-index:200;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease;
}
.overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--surface);
  border:1px solid rgba(91,163,245,.18);
  border-radius:8px;
  width:100%;max-width:960px;
  max-height:92vh;overflow-y:auto;
  transform:translateY(22px);
  transition:transform .25s ease;
  position:relative;
}
.overlay.open .modal{transform:translateY(0);}
.modal::-webkit-scrollbar{width:3px;}
.modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

.modal-top{
  padding:28px 36px 24px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:flex-start;
}
.modal-title{font-size:1.55rem;font-weight:800;color:var(--text-bright);letter-spacing:-.02em;margin-bottom:8px;}
.modal-chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;
  letter-spacing:.15em;text-transform:uppercase;
  padding:3px 10px;border-radius:2px;
  border:1px solid rgba(91,163,245,.22);
  color:var(--accent-bright);
  background:rgba(91,163,245,.07);
}
.chip.assembly{color:#4fd18a;border-color:rgba(79,209,138,.22);background:rgba(79,209,138,.06);}
.close-btn{
  background:none;border:1px solid var(--border);
  color:var(--text-dim);width:34px;height:34px;
  border-radius:4px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;transition:all .15s;flex-shrink:0;
}
.close-btn:hover{color:var(--text-bright);border-color:var(--border-hover);}

.modal-diagram{
  padding:28px 36px;
  background:rgba(5,12,22,.5);
  border-bottom:1px solid var(--border);
}
.section-lbl{
  font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);
  margin-bottom:14px;
}
.diagram-wrap{position:relative;width:100%;}
.diagram-wrap svg{width:100%;height:auto;display:block;overflow:visible;}

.modal-parts{padding:28px 36px;}
table{width:100%;border-collapse:collapse;}
thead th{
  font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);
  text-align:left;padding:8px 12px;
  border-bottom:1px solid var(--border);
}
tbody td{
  padding:11px 12px;
  border-bottom:1px solid rgba(80,150,220,.06);
  font-size:12.5px;vertical-align:middle;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:rgba(91,163,245,.035);}
.td-num{
  width:28px;
  font-family:'JetBrains Mono',monospace;font-weight:700;
  font-size:10px;
}
.num-dot{
  display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;
  font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace;
}
.td-part{color:var(--text-bright);font-weight:600;}
.td-mfr{color:var(--text);}
.td-loc{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);line-height:1.5;}
.td-flag{font-size:19px;text-align:center;width:38px;}

.modal-footer{
  padding:14px 36px;
  border-top:1px solid var(--border);
  background:rgba(45,125,210,.05);
  display:flex;align-items:center;gap:10px;
  font-size:11.5px;
}
.footer-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim);}
.footer-val{color:var(--text-bright);font-weight:600;}

@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:580px){
  .grid{grid-template-columns:1fr;}
  main{padding:0 14px 60px;}
  header{padding:44px 14px 36px;}
  .modal-top,.modal-diagram,.modal-parts,.modal-footer{padding-left:18px;padding-right:18px;}
}
</style>
</head>

const BOEING_IDS = ['737max','757','777'];
const AIRBUS_IDS = ['a318','a320','a340'];

// ─── RENDER CARDS ──────────────────────────────────────────────────────────
function renderCards(ids, containerId) {
  const el = document.getElementById(containerId);
  el.innerHTML = ids.map(id => {
    const a = AIRCRAFT[id];
    return `
    <div class="card" onclick="openModal('${id}')">
      <div class="card-silhouette">
        <svg viewBox="0 0 560 210" xmlns="http://www.w3.org/2000/svg">
          ${SVG[id]}
        </svg>
      </div>
      <div class="card-body">
        <div class="card-model">${a.name}</div>
        <div class="card-sub">${a.type}</div>
        <div class="card-specs">
          <div class="spec"><div class="spec-k">Range</div><div class="spec-v">${a.range.split('/')[0].trim()}</div></div>
          <div class="spec"><div class="spec-k">Capacity</div><div class="spec-v">${a.capacity}</div></div>
          <div class="spec"><div class="spec-k">First Flight</div><div class="spec-v">${a.firstFlight.split(' ').slice(-1)[0]}</div></div>
        </div>
      </div>
      <div class="card-cta">Explore component origins <span>→</span></div>
    </div>`;
  }).join('');
}

renderCards(BOEING_IDS, 'boeing-grid');
renderCards(AIRBUS_IDS, 'airbus-grid');

// ─── MODAL ─────────────────────────────────────────────────────────────────
function buildCalloutSVG(id) {
  const a = AIRCRAFT[id];
  // Build callout overlay in same coordinate system as aircraft SVG
  const lines = a.callouts.map((c, i) => {
    const color = DOT_COLORS[i];
    // pick a label anchor away from the dot
    const lx = c.cx < 280 ? c.cx - 60 : c.cx + 60;
    const ly = c.cy < 105 ? c.cy - 28 : c.cy + 28;
    return `
      <line x1="${c.cx}" y1="${c.cy}" x2="${lx}" y2="${ly}" stroke="${color}" stroke-width="1" stroke-dasharray="4,3" opacity=".7"/>
      <circle cx="${c.cx}" cy="${c.cy}" r="9" fill="${color}" opacity=".92"/>
      <text x="${c.cx}" y="${c.cy+3.5}" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="700" font-family="JetBrains Mono,monospace">${i+1}</text>
    `;
  }).join('');
  return `
    <svg viewBox="0 0 560 210" xmlns="http://www.w3.org/2000/svg" class="modal-diagram-svg">
      ${SVG[id]}
      ${lines}
    </svg>`;
}

function buildPartsTable(id) {
  const a = AIRCRAFT[id];
  const rows = a.parts.map((p, i) => {
    const color = DOT_COLORS[i];
    return `
    <tr>
      <td class="td-num"><div class="num-dot" style="background:${color};color:#fff">${i+1}</div></td>
      <td class="td-part">${p.component}</td>
      <td class="td-mfr">${p.manufacturer}</td>
      <td class="td-loc">${p.location}<br><span style="color:var(--text-dim);font-size:9.5px">${p.country}</span></td>
      <td class="td-flag">${p.flag}</td>
    </tr>`;
  }).join('');
  return `
  <table>
    <thead>
      <tr>
        <th>#</th><th>Component</th><th>Manufacturer</th><th>Origin</th><th>Flag</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function openModal(id) {
  const a = AIRCRAFT[id];
  document.getElementById('modal').innerHTML = `
    <div class="modal-top">
      <div class="modal-title-group">
        <div class="modal-title">${a.name}</div>
        <div class="modal-chips">
          <span class="chip">${a.type}</span>
          <span class="chip">${a.engines}</span>
          <span class="chip assembly">Assembly ▸ ${a.assembly}</span>
        </div>
      </div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-diagram">
      <div class="section-lbl">Component Origin Diagram</div>
      <div class="diagram-wrap">${buildCalloutSVG(id)}</div>
    </div>
    <div class="modal-parts">
      <div class="section-lbl">Numbered Component Breakdown</div>
      ${buildPartsTable(id)}
    </div>
    <div class="modal-footer">
      <span class="footer-lbl">First Flight</span>
      <span class="footer-val">${a.firstFlight}</span>
      <span style="margin:0 10px;color:var(--border)">|</span>
      <span class="footer-lbl">Range</span>
      <span class="footer-val">${a.range}</span>
      <span style="margin:0 10px;color:var(--border)">|</span>
      <span class="footer-lbl">Typical Capacity</span>
      <span class="footer-val">${a.capacity}</span>
    </div>`;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
